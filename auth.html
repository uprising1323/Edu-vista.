<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVista - Login/Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0a1128 0%, #1a2351 50%, #2d3561 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .auth-title {
            color: #1a365d;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4a5568;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }
        .btn {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
        }
        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
            margin-top: 0.75rem;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .error-message {
            color: #e53e3e;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        .success-message {
            color: #38a169;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 1.5rem;
            color: #4a5568;
        }
        .auth-toggle a {
            color: #4299e1;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .auth-toggle a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1 class="auth-title" id="auth-title">Welcome to EduVista</h1>
        
        <!-- Login Form -->
        <div id="login-form">
            <div class="form-group">
                <label for="login-email" class="form-label">Email</label>
                <input type="email" id="login-email" class="form-input" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="login-password" class="form-label">Password</label>
                <input type="password" id="login-password" class="form-input" placeholder="Enter your password">
            </div>
            <div id="login-error" class="error-message"></div>
            <button id="login-btn" class="btn btn-primary">Login</button>
            <p class="auth-toggle">Don't have an account? <a id="show-signup">Sign up</a></p>
        </div>

        <!-- Signup Form (initially hidden) -->
        <div id="signup-form" style="display: none;">
            <div class="form-group">
                <label for="signup-email" class="form-label">Email</label>
                <input type="email" id="signup-email" class="form-input" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="signup-password" class="form-label">Password</label>
                <input type="password" id="signup-password" class="form-input" placeholder="Create a password (min 6 characters)">
            </div>
            <div class="form-group">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm-password" class="form-input" placeholder="Confirm your password">
            </div>
            <div id="signup-error" class="error-message"></div>
            <div id="signup-success" class="success-message"></div>
            <button id="signup-btn" class="btn btn-primary">Sign Up</button>
            <p class="auth-toggle">Already have an account? <a id="show-login">Login</a></p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc 
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyAvC2UrHIrOjRQrvJm1YSMFoz24N3c0RD0",
            authDomain: "eduvista-1d822.firebaseapp.com",
            projectId: "eduvista-1d822",
            storageBucket: "eduvista-1d822.firebasestorage.app",
            messagingSenderId: "902087761435",
            appId: "1:902087761435:web:e24671b72153e3b27c62be",
            measurementId: "G-MT39PVBZH9"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const showSignupBtn = document.getElementById('show-signup');
        const showLoginBtn = document.getElementById('show-login');
        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const loginError = document.getElementById('login-error');
        const signupError = document.getElementById('signup-error');
        const signupSuccess = document.getElementById('signup-success');
        const authTitle = document.getElementById('auth-title');

        // Toggle between login and signup forms
        showSignupBtn.addEventListener('click', () => {
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            authTitle.textContent = 'Create an Account';
            clearErrors();
        });

        showLoginBtn.addEventListener('click', () => {
            signupForm.style.display = 'none';
            loginForm.style.display = 'block';
            authTitle.textContent = 'Welcome to EduVista';
            clearErrors();
        });

        // Clear error messages
        function clearErrors() {
            loginError.textContent = '';
            signupError.textContent = '';
            signupSuccess.textContent = '';
        }

        // Handle login
        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if (!email || !password) {
                loginError.textContent = 'Please fill in all fields';
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                // User is signed in
                console.log('User logged in:', userCredential.user);
                // The onAuthStateChanged listener will handle the redirect
            } catch (error) {
                console.error('Login error:', error);
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    loginError.textContent = 'Invalid email or password';
                } else {
                    loginError.textContent = 'An error occurred. Please try again.';
                }
            }
        });

        // Handle signup
        signupBtn.addEventListener('click', async () => {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validation
            if (!email || !password || !confirmPassword) {
                signupError.textContent = 'Please fill in all fields';
                return;
            }
            
            if (password !== confirmPassword) {
                signupError.textContent = 'Passwords do not match';
                return;
            }
            
            if (password.length < 6) {
                signupError.textContent = 'Password must be at least 6 characters';
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                // Store basic user data in Firestore
                await setDoc(doc(db, 'users', userCredential.user.uid), {
                    email: email,
                    createdAt: new Date().toISOString()
                });
                
                console.log('User signed up:', userCredential.user);
                signupSuccess.textContent = 'Account created successfully! Redirecting...';
                
                // The onAuthStateChanged listener will handle the redirect
                
            } catch (error) {
                console.error('Signup error:', error);
                if (error.code === 'auth/email-already-in-use') {
                    signupError.textContent = 'An account with this email already exists';
                } else if (error.code === 'auth/invalid-email') {
                    signupError.textContent = 'Please enter a valid email address';
                } else {
                    signupError.textContent = 'An error occurred. Please try again.';
                }
            }
        });

        // Check if user is already logged in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // Store basic user data in session
                    sessionStorage.setItem('user', JSON.stringify({
                        uid: user.uid,
                        email: user.email
                    }));
                    
                    // Redirect to index.html
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error('Error handling auth state:', error);
                    loginError.textContent = 'Error loading user data. Please try again.';
                }
            }
        });

        // Allow form submission with Enter key
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (loginForm.style.display !== 'none') {
                    loginBtn.click();
                } else {
                    signupBtn.click();
                }
            }
        });
    </script>
</body>
</html>
